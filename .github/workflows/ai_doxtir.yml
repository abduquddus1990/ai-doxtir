name: AI Doxtir video

# Toshkent vaqti = UTC + 5. Har kuni 1 ta video: 19:30 (asosiy), 20:30 (zaxira).
# Zaxira ish faqat asosiy ish yubormagan bo'lsa ishlaydi (data/sent.json).
on:
  schedule:
    - cron: "30 14 * * *"    # 19:30 Toshkent
    - cron: "30 15 * * *"    # 20:30 Toshkent — zaxira
  workflow_dispatch:
    inputs:
      episode:
        description: "Epizod id (bo'sh = navbatdagi). Masalan: e03_implant"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-doxtir
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }

      - name: Bugun yuborilganmi
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python run.py --check >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Secretlar tekshiruvi
        if: steps.plan.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_MANUAL_CHAT_IDS: ${{ secrets.TG_MANUAL_CHAT_IDS }}
        run: |
          for v in TG_BOT_TOKEN TG_MANUAL_CHAT_IDS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v kiritilmagan: Settings -> Secrets and variables -> Actions"; exit 1; fi
          done

      - name: Tizim paketlari
        if: steps.plan.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1

      - name: Kutubxonalar (Blender bpy ~ 400 MB)
        if: steps.plan.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 3D render, montaj va Telegramga yuborish
        if: steps.plan.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_MANUAL_CHAT_IDS: ${{ secrets.TG_MANUAL_CHAT_IDS }}
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then python run.py --episode "${{ github.event.inputs.episode }}"; else python run.py; fi

      - name: Videoni artefakt sifatida saqlash (7 kun)
        if: steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: { name: video, path: out/*.mp4, retention-days: 7 }

      - name: Holatni saqlash (sent.json)
        if: always() && steps.plan.outputs.skip != 'true'
        run: |
          git config user.name "ai-doxtir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "holat yangilandi" && git pull --rebase -q && git push)

      - name: Xato bo'lsa Telegramga xabar
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] || exit 0
          for c in $(echo "$TG_ADMIN_CHAT_ID" | tr ',' ' '); do
            curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$c" -d text="AI Doxtir: video yasashda xato. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          done

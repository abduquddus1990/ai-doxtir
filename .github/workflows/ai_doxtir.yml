name: AI Doxtir video

# Toshkent vaqti = UTC + 5. Har kuni 2 slot, har slotda @ai_doxtir + @ai_olmaliq videolari:
#   06:00 (am) va 19:00 (pm). Render ~45 daqiqa oldin boshlanadi, video aniq vaqtda yuboriladi (run.py --send-at auto).
#   Zaxira ishlar (06:30, 19:30) faqat slot hali yuborilmagan bo'lsa ishlaydi (data/sent*.json).
on:
  schedule:
    # GitHub jadvali soat boshida kechikadi — g'alati daqiqalar va bir nechta zaxira ishlatiladi
    - cron: "7 0 * * *"      # 05:07 Toshkent → 06:00 da yuboradi
    - cron: "41 0 * * *"     # 05:41 — zaxira
    - cron: "23 1 * * *"     # 06:23 — zaxira
    - cron: "7 13 * * *"     # 18:07 Toshkent → 19:00 da yuboradi
    - cron: "41 13 * * *"    # 18:41 — zaxira
    - cron: "23 14 * * *"    # 19:23 — zaxira
  workflow_dispatch:
    inputs:
      channel:
        description: "Kanal"
        type: choice
        options: [ikkalasi, doxtir, olmaliq]
        default: ikkalasi
      episode:
        description: "Epizod id (bo'sh = navbatdagi). Masalan: e03_implant yoki o01_nomi. Aniq epizod navbatni o'zgartirmaydi."
        required: false
        default: ""
      mark_sent:
        description: "Aniq epizodni yuborilgan deb belgilash (jadvalda qayta kelmaydi)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-doxtir
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }

      - name: Reja
        id: plan
        run: |
          CH="doxtir,olmaliq"
          case "${{ github.event.inputs.channel }}" in doxtir) CH=doxtir;; olmaliq) CH=olmaliq;; esac
          echo "channels=$CH" >> "$GITHUB_OUTPUT"
          pip install -q requests python-dotenv
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python run.py --check --channels "$CH" --slot auto >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Secretlar tekshiruvi
        if: steps.plan.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_MANUAL_CHAT_IDS: ${{ secrets.TG_MANUAL_CHAT_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for v in TG_BOT_TOKEN TG_MANUAL_CHAT_IDS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v kiritilmagan: Settings -> Secrets and variables -> Actions"; exit 1; fi
          done
          [ -n "$ANTHROPIC_API_KEY" ] || echo "::warning::ANTHROPIC_API_KEY yo'q — navbat tugaganda yangi ssenariylar yozilmaydi"

      - name: Tizim paketlari
        if: steps.plan.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1

      - name: Kutubxonalar (Blender bpy ~ 400 MB)
        if: steps.plan.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 3D render, montaj va Telegramga yuborish
        if: steps.plan.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          TG_MANUAL_CHAT_IDS: ${{ secrets.TG_MANUAL_CHAT_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          CH="${{ steps.plan.outputs.channels }}"
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            MS=""; [ "${{ github.event.inputs.mark_sent }}" = "true" ] && MS="--mark-sent"
            python run.py --channels "$CH" --episode "${{ github.event.inputs.episode }}" $MS
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python run.py --channels "$CH" --slot auto --send-at auto
          else
            python run.py --channels "$CH"
          fi

      - name: Videoni artefakt sifatida saqlash (7 kun)
        if: steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with: { name: video, path: out/*.mp4, retention-days: 7, if-no-files-found: ignore }

      - name: Holatni saqlash (sent*.json, yangi ssenariylar)
        if: always() && steps.plan.outputs.skip != 'true'
        run: |
          git config user.name "ai-doxtir-bot"
          git config user.email "actions@users.noreply.github.com"
          python tools/make_prompt.py || true
          git add data/ episodes/ channels/ inbox/ docs/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "holat yangilandi" && git pull --rebase -q && git push)

      - name: Xato bo'lsa Telegramga xabar
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          [ -n "$TG_BOT_TOKEN" ] || exit 0
          for c in $(echo "$TG_ADMIN_CHAT_ID" | tr ',' ' '); do
            curl -s "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" -d chat_id="$c" -d text="AI Doxtir: video yasashda xato. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          done
